spring:
  application:
    name: meesho-gstr1-converter
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:taxpulse}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
server:
  port: ${PORT:8081}

jwt:
  secret: ${JWT_SECRET:taxpulse-jwt-super-secret-key-for-development-32bytes}
  expiration: ${JWT_EXPIRATION:86400000}

# Base URL of the frontend app. Used by the OAuth2 success handler to build the
# post-login redirect (e.g. https://gstr1generator.web.app) and by CORS.
frontend-url: ${FRONTEND_URL:http://localhost:4200}
